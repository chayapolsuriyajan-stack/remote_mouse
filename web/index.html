<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Remote Mouse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span id="status" class="status status--off">Connecting</span>
    <span class="hint" id="hint">1 finger: move &middot; tap: click &middot; 2 fingers: scroll &middot; 3: desktops</span>
  </header>

  <main id="pad" class="pad">
    <div class="pad__edge" aria-hidden="true"></div>
    <p class="pad__label">trackpad</p>
  </main>

  <footer class="buttons">
    <button class="btn" data-button="l" type="button">Left</button>
    <button class="btn btn--mid" data-button="m" type="button">Middle</button>
    <button class="btn" data-button="r" type="button">Right</button>
  </footer>

  <div id="pinDialog" class="overlay" hidden>
    <form id="pinForm" class="card">
      <h1>Pair with your PC</h1>
      <p>Enter the 6-digit PIN shown in the terminal on your computer, or just scan the QR code it printed.</p>
      <input id="pinInput" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="12" placeholder="000000" aria-label="Pairing PIN">
      <button class="btn btn--primary" type="submit">Connect</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
